id: quicksort-visualizer
title: Quicksort Visualizer
prompt: |
  Create a single-page app that visualizes the quicksort algorithm step by step.
  Features: random array generation, step-through controls, auto-play with speed adjustment,
  visual highlighting of pivot/comparisons/swaps, statistics display (comparisons, swaps, steps).
  Dark theme with smooth animations.
